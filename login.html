<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Login CMS</title>
<style>
body{
    background:#0f0f14;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:#1c1c25;
    padding:40px;
    border-radius:12px;
    width:300px;
}
input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:6px;
}
button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#ff00aa;
    color:white;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>
<div class="box">
<h2>Connexion CMS</h2>

<input type="email" id="email" placeholder="email">
<input type="password" id="password" placeholder="mot de passe">

<button onclick="login()">Connexion</button>

<p id="msg"></p>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const supabaseUrl = "https://hqsogbtviyleioxlfuaa.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxc29nYnR2aXlsZWlveGxmdWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNjE1MjYsImV4cCI6MjA4NjczNzUyNn0.lFJ2hi4esPILv069ypGGrvZX-5xirgqBT_2l0Op9UFQ";

const supabase = createClient(supabaseUrl, supabaseKey);

window.login = async function(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if(error){
        document.getElementById("msg").innerText = error.message;
    }else{
        document.getElementById("msg").innerText = "Connecté ✔";
        window.location.href = "cms.html";
    }
}
</script>

</body>
</html>
